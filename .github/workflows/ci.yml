name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    name: Validate PR & Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Validate PR Title & No-Emoji Standard
        run: node .github/scripts/validate-pr-title.js "${{ github.event.pull_request.title }}"

      - name: Validate Branch Commits
        run: node .github/scripts/validate-commits.js
        env:
          BASE_REF: ${{ github.base_ref }}

  code-quality:
    name: Code Quality (Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Verify package packaging (dry run)
        run: npm pack --dry-run

  test-unit:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

  test-e2e:
    name: End-to-End Test (Node 20.x)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run beginner end-to-end flow test
        run: npm run test:e2e

  ci-success:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [validate-pr, code-quality, test-unit, test-e2e]
    if: always()
    steps:
      - name: Write GitHub Step Summary
        run: |
          echo "### Continuous Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| PR & Commit Standards | ${{ needs.validate-pr.result == 'success' && 'Passed' || (needs.validate-pr.result == 'skipped' && 'Skipped (Direct Push)' || 'Failed') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality (Lint & Format) | ${{ needs.code-quality.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests Matrix | ${{ needs.test-unit.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| End-to-End Verification | ${{ needs.test-e2e.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Evaluate Overall Status
        run: |
          if [ "${{ needs.validate-pr.result }}" = "failure" ] || \
             [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.test-e2e.result }}" != "success" ]; then
            echo "One or more required CI checks failed."
            exit 1
          fi
          echo "All required CI quality checks and test suites passed successfully."
