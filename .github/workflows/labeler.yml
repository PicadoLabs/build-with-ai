name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-Label PR Area and Type
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Apply Area Labels
        uses: actions/labeler@v5
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Apply Type and Status Labels
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = context.payload.pull_request.title || '';
            const labelsToAdd = [];

            if (/^fix(\(.*\))?:/i.test(title)) labelsToAdd.push('type:bug');
            else if (/^feat(\(.*\))?:/i.test(title)) labelsToAdd.push('type:feature');
            else if (/^docs(\(.*\))?:/i.test(title)) labelsToAdd.push('type:docs');
            else if (/^perf(\(.*\))?:/i.test(title)) labelsToAdd.push('type:performance');
            else if (/^refactor(\(.*\))?:/i.test(title)) labelsToAdd.push('type:refactor');
            else if (/^(sec|security)(\(.*\))?:/i.test(title)) labelsToAdd.push('type:security');

            if (!context.payload.pull_request.merged) {
              labelsToAdd.push('status:ready-for-review');
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labelsToAdd
              });
            }
