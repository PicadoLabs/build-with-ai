area: cli:
  - changed-files:
      - any-glob-to-any-file: ['bin/**', 'lib/**']

area: templates:
  - changed-files:
      - any-glob-to-any-file: ['templates/**']

area: tests:
  - changed-files:
      - any-glob-to-any-file: ['tests/**']

area: docs:
  - changed-files:
      - any-glob-to-any-file: ['README.md', 'CONTRIBUTING.md', 'CHANGELOG.md', 'docs/**', '*.md']

area: ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', '.githooks/**']
